# Application Configuration
# Bind to 0.0.0.0 so other containers in the Docker network can reach us
app:
  title: "Crawl4AI API"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 11235
  reload: False
  workers: 1
  timeout_keep_alive: 300

# LLM Configuration (uses Ollama inside the same network)
llm:
  provider: "ollama/llama3.1"
  api_key: "ollama"
  base_url: "http://hub-ollama:11434/v1"

# Redis Configuration (use our hub-redis)
redis:
  host: "hub-redis"
  port: 6379
  db: 0
  password: ""
  task_ttl_seconds: 3600
  ssl: False

# Rate limiting / auth. The API token is NOT set here: the server enforces the
# CRAWL4AI_API_TOKEN environment variable (required in docker-compose.yml,
# sourced from .env). Never commit a secret to this file.
security:
  enabled: true
  trusted_hosts: ["*"]
