global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # GPU utilization, VRAM, temperature, power. The metrics that actually say
  # whether a model fits and how hard the card is working.
  - job_name: gpu
    static_configs:
      - targets: [127.0.0.1:9835]

  # Native Linux host CPU, memory and disk.
  - job_name: node
    static_configs:
      - targets: [127.0.0.1:9100]

  # Is Ollama answering? Is the UI up? Probe over HTTP rather than inferring
  # liveness from container state.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://127.0.0.1:11434/
          - http://127.0.0.1:8080/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
