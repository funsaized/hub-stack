# Alerts for a single-box local LLM hub. Deliberately few: on a machine with
# one operator who is usually sitting at it, an alert that fires routinely is
# worse than no alert. These cover the three ways this box actually fails --
# it runs out of VRAM, it runs out of disk, or Ollama stops answering.
#
# Nothing routes these anywhere yet; they surface in Prometheus at /alerts.

groups:
  - name: llm-hub
    rules:
      - alert: OllamaNotAnswering
        expr: probe_success{instance="http://127.0.0.1:11434/"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Ollama is not answering HTTP on 11434"

      - alert: OllamaMetricsProxyDown
        expr: up{job="ollama"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "The Ollama metrics proxy is down"

      - alert: ModelPartiallyOffloaded
        expr: >
          ollama_model_size_bytes > 0 and
          ollama_model_vram_bytes / ollama_model_size_bytes < 0.99
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.model }} is not fully loaded into GPU memory"

      - alert: OllamaHighErrorRate
        expr: >
          sum(rate(ollama_requests_total{status!~"2.."}[5m])) /
          clamp_min(sum(rate(ollama_requests_total[5m])), 0.001) > 0.10
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "More than 10% of Ollama generation requests are failing"

      - alert: OllamaRequestQueueBacklog
        expr: ollama_active_requests > 1
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "Requests are waiting for qwen3.5:9b's single inference slot"

      - alert: ObservabilityComponentDown
        expr: up{job=~"prometheus|loki|alloy|gpu|node|blackbox"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Observability component {{ $labels.job }} is down"

      - alert: OpenWebUINotAnswering
        expr: probe_success{instance="http://127.0.0.1:8080/"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Open WebUI is not answering HTTP on 8080"

      - alert: GpuMemoryNearlyFull
        expr: >
          nvidia_smi_memory_used_bytes / clamp_min(nvidia_smi_memory_total_bytes, 1) > 0.95
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "GPU memory above 95% for 5 minutes -- a larger model will not load"

      - alert: GpuSustainedHighTemperature
        expr: nvidia_smi_temperature_gpu > 85
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "GPU above 85C for 10 minutes -- expect thermal throttling"

      # Docker data and native Ollama models are on the Linux root filesystem.
      - alert: ModelDiskNearlyFull
        expr: >
          node_filesystem_avail_bytes{mountpoint="/"} /
          clamp_min(node_filesystem_size_bytes{mountpoint="/"}, 1) < 0.10
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Less than 10% free on the host disk -- model pulls will fail"

      - alert: HostMemoryNearlyExhausted
        expr: >
          node_memory_MemAvailable_bytes / clamp_min(node_memory_MemTotal_bytes, 1) < 0.10
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Less than 10% RAM available on the host"
