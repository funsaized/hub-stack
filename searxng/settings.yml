# SearXNG settings - minimal private search config
# Most options use defaults; the key one is allowing JSON output for the crawler
use_default_settings: true

# The server secret is NOT set here: SearXNG reads it from the SEARXNG_SECRET
# environment variable (required in docker-compose.yml, sourced from .env),
# which overrides any settings.yml value. Never commit a secret to this file.
server:
  bind_address: "0.0.0.0"
  port: 8080

search:
  formats:
    - html
    - json

# Enable JSON output for the crawler to consume
# Keyless general-web engines, deliberately several (HUB-042). Running on one
# engine meant a single CAPTCHA blocked all acquisition; query planning issues
# 3-6 searches per job, so the load has to spread. google/google cse stay off:
# they need an API key and suspend immediately without one.
engines:
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  - name: wikipedia
    disabled: false
  - name: google
    disabled: true
