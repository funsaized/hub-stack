# SearXNG settings - minimal private search config
# Most options use defaults; the key one is allowing JSON output for the crawler
use_default_settings: true

# The server secret is NOT set here: SearXNG reads it from the SEARXNG_SECRET
# environment variable (required in docker-compose.yml, sourced from .env),
# which overrides any settings.yml value. Never commit a secret to this file.
server:
  bind_address: "0.0.0.0"
  port: 8080

search:
  formats:
    - html
    - json

# Enable JSON output for the crawler to consume
engines:
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: true
  - name: google
    disabled: true
  - name: brave
    disabled: true
  - name: startpage
    disabled: true
