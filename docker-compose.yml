name: hub

services:
  # =====================================================================
  # Local LLM server (OpenAI-compatible API on :11434)
  # =====================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: hub-ollama
    restart: unless-stopped
    ports:
      # Localhost by default. Set OLLAMA_BIND_ADDRESS to a trusted LAN or
      # Tailscale interface address only when remote model access is intended.
      - "${OLLAMA_BIND_ADDRESS:-127.0.0.1}:${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./healthcheck:/healthcheck:ro
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "bash", "/healthcheck/healthcheck.sh", "11434"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # =====================================================================
  # Vector database for RAG over crawled content
  # =====================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hub-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
      - ./healthcheck:/healthcheck:ro
    healthcheck:
      test: ["CMD", "bash", "/healthcheck/healthcheck.sh", "6333"]
      interval: 30s
      timeout: 5s
      retries: 5

  # =====================================================================
  # Redis
  # =====================================================================
  redis:
    image: redis:7-alpine
    container_name: hub-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # Queue/job keys must never be evicted under memory pressure.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  # =====================================================================
  # Dozzle — Docker log viewer
  # =====================================================================
  dozzle:
    profiles: [logs]
    image: amir20/dozzle:latest
    container_name: hub-dozzle
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_NO_ANALYTICS: "true"

  # =====================================================================
  # Uptime Kuma
  # =====================================================================
  uptime-kuma:
    profiles: [uptime]
    image: louislam/uptime-kuma:latest
    container_name: hub-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.1.0
    container_name: hub-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.4.0
    container_name: hub-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # =====================================================================
  # SearXNG — private meta-search
  # =====================================================================
  searxng:
    image: searxng/searxng:latest
    container_name: hub-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8889:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./healthcheck:/healthcheck:ro
    environment:
      - SEARXNG_SECRET=changeme_in_production
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "python3", "/healthcheck/healthcheck-py3.py", "8080"]
      interval: 30s
      timeout: 5s
      retries: 5

  # =====================================================================
  # Crawl4AI — web crawler
  # =====================================================================
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: hub-crawl4ai
    restart: unless-stopped
    volumes:
      - crawl4ai_data:/app/data
      - ./healthcheck:/healthcheck:ro
      - ./crawl4ai-config.yml:/app/config.yml:ro
    environment:
      - CRAWL4AI_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://hub-ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b
      - CRAWL4AI_API_TOKEN=hub-crawl4ai-shared-token
      - APP_HOST=0.0.0.0
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/healthcheck/healthcheck.sh", "11235"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # =====================================================================
  # Research Hub API — FastAPI orchestrator
  # =====================================================================
  research-hub:
    build:
      context: ./research-hub
      dockerfile: Dockerfile
    container_name: hub-research-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - research_hub_data:/app/data
    environment:
      - REDIS_URL=redis://hub-redis:6379/0
      - QDRANT_URL=http://hub-qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-research_corpus__nomic_embed_text_768}
      - OLLAMA_URL=http://hub-ollama:11434
      - LLM_MODEL=qwen2.5:7b
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-768}
      - SEARXNG_URL=http://hub-searxng:8080
      - CRAWL4AI_URL=http://hub-crawl4ai:11235
      - CRAWL4AI_TOKEN=hub-crawl4ai-shared-token
      - LOG_LEVEL=info
      - DOCUMENT_STORE_PATH=/app/data/documents.sqlite3
      - MODEL_CONTEXT_TOKENS=${MODEL_CONTEXT_TOKENS:-8192}
      - ANSWER_RESERVE_TOKENS=${ANSWER_RESERVE_TOKENS:-1024}
      - ALLOW_CUSTOM_SYSTEM_PROMPTS=${ALLOW_CUSTOM_SYSTEM_PROMPTS:-false}
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
    # Healthcheck defined in Dockerfile (uses curl)

  # Dedicated durable ingestion worker. API replicas only enqueue work; this
  # process owns crawling, embedding, retries, and lease reconciliation.
  research-worker:
    build:
      context: ./research-hub
      dockerfile: Dockerfile
    container_name: hub-research-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 30s
    # The shared image probes the API's /livez endpoint; the worker has no HTTP
    # server, so disable that inherited probe. Leases/reconciliation provide its
    # failure detection and the restart policy restores the process.
    healthcheck:
      disable: true
    environment:
      - REDIS_URL=redis://hub-redis:6379/0
      - QDRANT_URL=http://hub-qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-research_corpus__nomic_embed_text_768}
      - OLLAMA_URL=http://hub-ollama:11434
      - LLM_MODEL=qwen2.5:7b
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-768}
      - SEARXNG_URL=http://hub-searxng:8080
      - CRAWL4AI_URL=http://hub-crawl4ai:11235
      - CRAWL4AI_TOKEN=hub-crawl4ai-shared-token
      - WORKER_LEASE_SECONDS=${WORKER_LEASE_SECONDS:-60}
      - WORKER_HEARTBEAT_SECONDS=${WORKER_HEARTBEAT_SECONDS:-15}
      - JOB_TIMEOUT_SECONDS=${JOB_TIMEOUT_SECONDS:-1800}
      - JOB_MAX_ATTEMPTS=${JOB_MAX_ATTEMPTS:-3}
      - LOG_LEVEL=info
      - DOCUMENT_STORE_PATH=/app/data/documents.sqlite3
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-16}
      - EMBEDDING_BATCH_CHARS=${EMBEDDING_BATCH_CHARS:-12000}
      - DEPENDENCY_MAX_ATTEMPTS=${DEPENDENCY_MAX_ATTEMPTS:-3}
      - RESPECT_ROBOTS_TXT=${RESPECT_ROBOTS_TXT:-true}
    volumes:
      - research_hub_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy

  # =====================================================================
  # Open WebUI — chat interface
  # =====================================================================
  open-webui:
    profiles: [webui]
    image: ghcr.io/open-webui/open-webui:v0.10.0
    container_name: hub-open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://hub-ollama:11434
      WEBUI_AUTH: "true"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-changeme_in_production}
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: http://hub-research-hub:8000/v1
      OPENAI_API_KEYS: hub-local
      OPENAI_API_CONFIGS: '{"0":{"enable":true,"model_ids":["research-corpus"],"tags":["Research Hub"]}}'
      ENABLE_PERSISTENT_CONFIG: "false"
    depends_on:
      ollama:
        condition: service_healthy
      research-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  ollama_data:
  qdrant_data:
  redis_data:
  uptime_kuma_data:
  crawl4ai_data:
  research_hub_data:
  open_webui_data:
  prometheus_data:
  grafana_data:
