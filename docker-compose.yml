name: hub

# Local LLM hub — Ollama, a chat UI, and metrics for how the box is coping.
#
# `name: hub` is load-bearing. Compose derives volume names from the project
# name, so dropping it renames the persistent WebUI and monitoring volumes.
#
# Everything is on by default: there are no compose profiles here. Compose
# interpolates the whole file before it filters by profile, so a profile-gated
# service with a required ${VAR:?} still blocks startup for every other
# service. Profiles bought nothing once the research stack was removed.
#
# All host ports bind to 127.0.0.1. Set *_BIND_ADDRESS to a Tailscale or
# trusted-LAN address only when remote access is actually intended.

services:
  # =====================================================================
  # Open WebUI — chat interface, wired to native Ollama and nothing else
  # =====================================================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.1
    container_name: hub-open-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_BIND_ADDRESS:-127.0.0.1}:${WEBUI_HOST_PORT:-8080}:8080"
    volumes:
      - open_webui_data:/app/backend/data
      - ./open-webui/start-native-ollama.py:/start-native-ollama.py:ro
    environment:
      # Single-user box bound to localhost; auth is off by operator decision.
      # Turn this back on before exposing the port to anything.
      WEBUI_AUTH: "${WEBUI_AUTH:-false}"
      DEFAULT_MODELS: qwen3.5:9b
      # No OpenAI-compatible backends. The research corpus that used to be
      # served here as a pseudo-model is gone.
      ENABLE_OPENAI_API: "false"
      ENABLE_PERSISTENT_CONFIG: "false"
    # Resolve the current Compose bridge gateway instead of hard-coding a
    # Docker subnet. Native Ollama listens on the host side of that gateway.
    command: ["python", "/start-native-ollama.py"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # =====================================================================
  # Logs
  # =====================================================================
  dozzle:
    image: amir20/dozzle:v10.6.15
    container_name: hub-dozzle
    restart: unless-stopped
    ports:
      - "${DOZZLE_BIND_ADDRESS:-127.0.0.1}:${DOZZLE_HOST_PORT:-9999}:8080"
    volumes:
      # Read-only socket: Dozzle reads container logs and nothing else.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_NO_ANALYTICS=true

  # =====================================================================
  # Metrics — what the box is doing while a model runs
  # =====================================================================
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: hub-prometheus
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.listen-address=${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:9090

  grafana:
    image: grafana/grafana:11.4.0
    container_name: hub-grafana
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SERVER_HTTP_ADDR=${GRAFANA_BIND_ADDRESS:-127.0.0.1}
      - GF_SERVER_HTTP_PORT=${GRAFANA_HOST_PORT:-3000}
    depends_on:
      - prometheus

  # Liveness of the two things a user touches. An HTTP probe verifies that the
  # services answer rather than merely reporting that their containers run.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: hub-blackbox-exporter
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
      - --web.listen-address=127.0.0.1:9115

  # Native Linux host CPU, memory, disk and filesystem.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: hub-node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

  # GPU utilization, VRAM, temperature and power, scraped from nvidia-smi.
  #
  # The NVIDIA Container Toolkit resolves this reservation to the host GPU.
  # `utility` is required because this exporter shells out to nvidia-smi.
  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.2.1
    container_name: hub-gpu-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9835:9835"
    # Pin fields so a driver update cannot add invalid Prometheus metric names
    # or silently change what is collected.
    command:
      - --query-field-names=name,uuid,utilization.gpu,utilization.memory,memory.total,memory.used,memory.free,temperature.gpu,power.draw,power.limit,clocks.current.graphics,clocks.current.memory,pstate
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, utility]

volumes:
  open_webui_data:
  prometheus_data:
  grafana_data:
