# CI for a Compose-only repository. There is no application source left to
# lint or test after the 2026-08-14 teardown, so this validates the two things
# that can still be wrong: the Compose file and the observability configs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        # Never print interpolated output -- it would echo .env values.
        run: docker compose config --quiet

  observability-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/observability:/o:ro" prom/prometheus:v3.1.0 \
            check config /o/prometheus.yml
      - name: Check dashboard JSON parses
        run: |
          for f in observability/grafana/dashboards/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
