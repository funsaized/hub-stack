# CI for a Compose-only repository. There is no application source left to
# lint or test after the 2026-08-14 teardown, so this validates the Compose,
# reverse-proxy, and observability configs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        # Never print interpolated output -- it would echo .env values.
        run: docker compose config --quiet
      - name: Check Open WebUI startup wrapper
        run: python3 -m py_compile open-webui/start-native-ollama.py
      - name: Check benchmark syntax
        run: python3 -m py_compile scripts/benchmark.py
      - name: Check Ollama metrics proxy
        run: python3 -m unittest discover -s observability -p 'test_*.py'

  caddy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - name: Build Caddy with Netlify DNS
        run: >-
          go run github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7 build v2.11.4
          --with github.com/caddy-dns/netlify@v1.2.0
          --output /tmp/caddy-netlify
      - name: Validate Caddy routes
        run: |
          printf 'import %s/caddy/conf.d/hub-stack.caddy 127.0.0.1\n' "$PWD" > /tmp/Caddyfile
          /tmp/caddy-netlify validate --config /tmp/Caddyfile
          if /tmp/caddy-netlify validate --adapter caddyfile \
            --config caddy/conf.d/hub-stack.caddy >/dev/null 2>&1; then
            echo "Caddy routes must require an explicit bind argument" >&2
            exit 1
          fi

  observability-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Prometheus config and alert rules
        # Mounted at /etc/prometheus, not an arbitrary path: prometheus.yml
        # refers to its rule file by absolute path, so promtool only resolves
        # it when the layout matches the container's.
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/observability:/etc/prometheus:ro" prom/prometheus:v3.1.0 \
            check config /etc/prometheus/prometheus.yml
      - name: Check dashboard JSON parses
        run: |
          for f in observability/grafana/dashboards/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
      - name: Check Loki config
        run: |
          docker run --rm -e LOKI_RETENTION=336h \
            -v "$PWD/observability/loki.yml:/etc/loki/config.yml:ro" \
            grafana/loki:3.3.2 -config.file=/etc/loki/config.yml \
            -config.expand-env=true -verify-config=true
      - name: Check Alloy syntax
        run: |
          docker run --rm \
            -v "$PWD/observability/alloy.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.6.1 fmt /etc/alloy/config.alloy >/dev/null
